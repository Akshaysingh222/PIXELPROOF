<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PixelProof</title>
  <style id="ppcss"></style>
  <style>
    body { margin: 0; padding: 12px; background: #faf8f4; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c1917; }
    textarea { width: 100%; box-sizing: border-box; min-height: 130px; font: inherit; border: 1px solid #d6d0c6; border-radius: 8px; padding: 8px; resize: vertical; }
    select { font: inherit; border: 1px solid #d6d0c6; border-radius: 7px; padding: 4px 6px; background: #fff; }
    label { font-size: 12.5px; color: #6b645b; font-weight: 600; display: block; margin: 8px 0 4px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    #out { margin-top: 10px; }
  </style>
</head>
<body>
  <div class="pp-root" style="display:block">
    <div class="pp-title"><span class="pp-px"></span>PixelProof</div>
    <p class="pp-hint">Paste text, or select text on any page and right-click <b>Check with PixelProof</b>. In LinkedIn, Gmail and X, use the <b>Check</b> button on the compose box instead.</p>
    <label for="type">Content type</label>
    <select id="type"><option>LinkedIn post</option><option>Email</option><option>X post</option><option>Web copy</option><option>Advertisement</option><option>Document</option></select>
    <label for="text">Text</label>
    <textarea id="text" placeholder="Paste or select some text…"></textarea>
    <div class="row">
      <button class="pp-btn pp-primary" id="check">Check</button>
      <button class="pp-btn" id="queue">Send to review queue</button>
      <button class="pp-btn" id="copy">Copy text</button>
      <a class="pp-hint" href="options.html" target="_blank">Settings</a>
    </div>
    <div id="out"></div>
  </div>
  <script src="lib/brandkit.js"></script>
  <script src="lib/engine.js"></script>
  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
