<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelProof · Brand checks before you publish</title>
  <meta name="description" content="PixelProof checks posts, ads, emails and documents against a brand's guidelines, approved facts and visual identity before they're published.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e4572e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="logo"><span class="px" aria-hidden="true"></span>PixelProof</div>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="check" aria-selected="true">Check content</button>
        <button role="tab" data-tab="review" aria-selected="false">Review queue <span class="count" id="queueCount" hidden>0</span></button>
        <button role="tab" data-tab="kit" aria-selected="false">Brand kit</button>
        <button role="tab" data-tab="insights" aria-selected="false">Insights</button>
        <button role="tab" data-tab="team" aria-selected="false">Team</button>
        <button role="tab" data-tab="about" aria-selected="false">How it works</button>
      </nav>
      <div class="top-right">
        <span id="account" hidden></span>
        <span class="badge" id="aiBadge" title="Whether the AI check is available on this deployment">Checking AI…</span>
        <div class="role" role="group" aria-label="Viewing as">
          <button data-role="creator" aria-pressed="true" title="Writes and submits content">Riya · Creator</button>
          <button data-role="reviewer" aria-pressed="false" title="Owns the brand kit and approves content">Arjun · Brand manager</button>
        </div>
      </div>
    </div>
  </header>

  <main id="app"></main>
  <footer>PixelProof by Team Pixel (Akshay Singh) · CodeNova India 2026 · Kitebird Money is a made-up brand used for this demo · Demo data stays in this browser; team workspaces are shared with your team</footer>

  <script src="js/brandkit.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/team.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
